name: Update Buildmarks card

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. 10:15 UTC is 19:15 in Korea.
    - cron: "15 10 * * 3"

# Default to no write access; each job opts into exactly what it needs.
permissions:
  contents: read

concurrency:
  # Never cancel a run that may be mid-commit: this job pushes to main.
  group: buildmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARD_PATH: assets/buildmarks-profile.svg
  PRIVATE_SCOPE_LABEL: Public + Private Projects
  PUBLIC_SCOPE_LABEL: Public GitHub

jobs:
  update-card:
    runs-on: ubuntu-latest
    # Two 10-minute generation attempts, plus checkout, validation and publishing.
    timeout-minutes: 25
    permissions:
      contents: write
      # Record degraded collection and close the notice after a published recovery.
      issues: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # Do not leave a write token in .git/config while the third-party card
          # action runs; the commit step authenticates explicitly instead.
          persist-credentials: false

      - name: Check two-week cadence
        id: cadence
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          anchor="2026-06-03"
          today="$(date -u +%F)"
          days=$(( ( $(date -u -d "$today" +%s) - $(date -u -d "$anchor" +%s) ) / 86400 ))

          if [ "$days" -lt 0 ]; then
            echo "Anchor date is in the future; skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failed or missed slot must not cost another full interval: the
          # cadence day always runs, and any other weekly attempt runs as well
          # once the committed card is already older than one interval.
          last_epoch="$(git log -1 --format=%ct -- "$CARD_PATH" || true)"
          if [ -z "$last_epoch" ]; then
            echo "No committed card yet; running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          age_days=$(( ( $(date -u +%s) - last_epoch ) / 86400 ))

          if [ $((days % 14)) -ne 0 ] && [ "$age_days" -lt 14 ]; then
            echo "Not a two-week Buildmarks update day ($age_days day(s) since the last card commit)."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Updating the card: $age_days day(s) since the previous card commit."
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: Prepare card generation
        id: generation
        if: steps.cadence.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "started_on=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          # A successful action must produce a new file, not reuse the checkout.
          rm -f -- "$CARD_PATH"

      # Pin the release commit so a moving tag cannot silently swap the renderer.
      - name: Generate private-local Buildmarks card
        id: private_card
        if: steps.cadence.outputs.should_run == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: 0disoft/buildmarks@e7a86647426048c276f6f723d431ee7952eac26d # v0.6.0
        with:
          username: ${{ github.repository_owner }}
          output: assets/buildmarks-profile.svg
          card-layout: compact
          generate-report: "false"
          private-local: "true"
          token: ${{ secrets.BUILDMARKS_PRIVATE_TOKEN }}
          activity-window-days: "180"

      - name: Generate public-only fallback card
        id: public_card
        if: steps.cadence.outputs.should_run == 'true' && steps.private_card.outcome == 'failure'
        timeout-minutes: 10
        uses: 0disoft/buildmarks@e7a86647426048c276f6f723d431ee7952eac26d # v0.6.0
        with:
          username: ${{ github.repository_owner }}
          output: assets/buildmarks-profile.svg
          card-layout: compact
          generate-report: "false"
          private-local: "false"
          token: ${{ github.token }}
          activity-window-days: "180"

      - name: Report public-only fallback
        if: >-
          steps.cadence.outputs.should_run == 'true' &&
          steps.private_card.outcome == 'failure' &&
          steps.public_card.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "::warning title=Buildmarks fell back to public data::Private-local collection failed, so this run generated a public-only card. Check the BUILDMARKS_PRIVATE_TOKEN secret."
          {
            echo "### Buildmarks card fell back to public data"
            echo ""
            echo "The private-local collection step failed, so this run rendered the public-only card."
            echo "The usual cause is an expired or under-scoped BUILDMARKS_PRIVATE_TOKEN secret."
            echo "Re-run this workflow after fixing the secret to restore private-local signals."
          } >> "$GITHUB_STEP_SUMMARY"

          # A step summary is invisible unless someone opens the run, so leave a
          # durable signal without opening a duplicate issue on every retry.
          # Filing the issue is a convenience only: a failure here must not stop
          # the card commit, which already recorded the fallback in the summary.
          # Each call is checked explicitly: this function runs as the left side
          # of a ||, a context where bash ignores errexit inside the body.
          record_fallback_issue() {
            gh label create buildmarks-degraded \
              --color FBCA04 \
              --description "Buildmarks card fell back to public-only data" \
              --force >/dev/null 2>&1 || true

            local run_url body existing
            run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            body="$(printf 'The scheduled private-local Buildmarks run failed, so the card was regenerated from public data only.\n\nWorkflow run: %s\n\nCheck the BUILDMARKS_PRIVATE_TOKEN secret, then re-run the workflow to restore private-local signals.' "$run_url")"

            if ! existing="$(gh issue list --state open --label buildmarks-degraded --limit 1 --json number --jq '.[0].number // empty')"; then
              echo "::warning title=Fallback notice::Could not query the buildmarks-degraded issues."
              return 1
            fi

            if [ -n "$existing" ]; then
              if ! gh issue comment "$existing" --body "$body" >/dev/null; then
                echo "::warning title=Fallback notice::Could not comment on buildmarks-degraded issue #$existing."
                return 1
              fi
              echo "Updated buildmarks-degraded issue #$existing."
            else
              if ! gh issue create --title "Buildmarks card fell back to public-only data" --label buildmarks-degraded --body "$body" >/dev/null; then
                echo "::warning title=Fallback notice::Could not open a buildmarks-degraded issue."
                return 1
              fi
              echo "Opened a new buildmarks-degraded issue."
            fi
          }

          record_fallback_issue || echo "::warning title=Fallback notice::The card fell back to public-only data, but the buildmarks-degraded issue could not be updated."

      - name: Validate generated card
        id: validate
        if: steps.cadence.outputs.should_run == 'true' && (steps.private_card.outcome == 'success' || steps.public_card.outcome == 'success')
        shell: bash
        env:
          PRIVATE_OUTCOME: ${{ steps.private_card.outcome }}
          GENERATED_SINCE: ${{ steps.generation.outputs.started_on }}
        run: |
          set -euo pipefail
          expected_scope="$PUBLIC_SCOPE_LABEL"
          if [ "$PRIVATE_OUTCOME" = "success" ]; then
            expected_scope="$PRIVATE_SCOPE_LABEL"
          fi
          python3 .github/scripts/validate_card.py "$CARD_PATH" \
            --scope "$expected_scope" --generated-since "$GENERATED_SINCE"

      - name: Update README cache-buster
        if: steps.cadence.outputs.should_run == 'true' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          tag="$(sha256sum "$CARD_PATH" | cut -c1-12)"
          sed -i -E "s#(assets/buildmarks-profile\.svg)(\?v=[^\"']*)?#\1?v=${tag}#" README.md

          if ! grep -q "assets/buildmarks-profile.svg?v=${tag}" README.md; then
            echo "::error title=README cache-buster::README.md does not reference $CARD_PATH, so the cache tag cannot be updated."
            exit 1
          fi

          echo "README cache tag set to $tag."

      - name: Commit and push updated card
        id: publish
        if: steps.cadence.outputs.should_run == 'true' && steps.validate.outcome == 'success'
        shell: bash
        env:
          PRIVATE_OUTCOME: ${{ steps.private_card.outcome }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          scope="public+private"
          if [ "$PRIVATE_OUTCOME" != "success" ]; then
            scope="public-only fallback"
          fi

          git add "$CARD_PATH" README.md

          if git diff --cached --quiet; then
            echo "Buildmarks card is already up to date."
            {
              echo "### Buildmarks card unchanged"
              echo ""
              echo "Scope: $scope."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update buildmarks card ($scope)"

          # The checkout step leaves no credential behind, so authenticate the
          # remote for this step only. The token is masked in the run log.
          trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          branch="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$branch" && git push origin "HEAD:$branch"; then
              # The token URL existed only for this push. Put the plain remote
              # back so no later step in this job can reuse the credential.
              git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
              {
                echo "### Buildmarks card updated"
                echo ""
                echo "Scope: $scope."
                echo "Cache tag: $(grep -oE 'buildmarks-profile\.svg\?v=[0-9a-f]+' README.md | head -n 1 || true)"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( attempt * 5 ))
          done

          echo "::error title=Push failed::The updated card could not be pushed after three attempts."
          exit 1

      - name: Close resolved collection notices
        if: >-
          steps.private_card.outcome == 'success' &&
          steps.validate.outcome == 'success' &&
          steps.publish.outcome == 'success'
        timeout-minutes: 1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! bash .github/scripts/close_degraded_issues.sh; then
            echo "::warning title=Recovery notice::The private-local card is published, but the collection notice could not be closed."
          fi

      - name: Fail when no card was generated
        if: >-
          steps.cadence.outputs.should_run == 'true' &&
          steps.private_card.outcome != 'success' &&
          steps.public_card.outcome != 'success'
        shell: bash
        run: |
          echo "::error title=No Buildmarks card::Both the private-local generation and the public fallback failed."
          exit 1
