    .profile-score { font-size:24px; font-weight:750; text-anchor:end; }
    .cover-serif { font-family:Georgia, "Times New Roman", serif; letter-spacing:-.5px; }
    .metric { font-size:15px; font-weight:600; }
    .value { font-size:15px; font-weight:700; text-anchor:end; font-variant-numeric:tabular-nums; }
    .missing { font-size:12px; font-weight:500; fill:var(--muted); }
    .missing-track { stroke:var(--line); stroke-width:2; stroke-dasharray:3 5; }
    .checked { font-size:12px; font-weight:600; fill:var(--muted); text-anchor:end; }
    .caption { font-size:12px; font-weight:600; fill:var(--muted); }
    .footer { font-size:12px; font-weight:500; fill:var(--muted); }
    .divider { stroke:var(--line); stroke-width:1; }
    .track { fill:var(--track); }
    .bar,.accent { fill:var(--accent); }
    .chip-bg { fill:var(--chip); }
    .chip { font-size:12px; font-weight:600; }

    .persona-emblem{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
    .emblem-halo{fill:var(--accent);fill-opacity:.07;stroke:none;}
    .emblem-paper{fill:var(--surface);}
    .emblem-fill{fill:var(--accent);}
    .emblem-cutout{fill:var(--surface);stroke:var(--surface);}
    .emblem-light{stroke:var(--surface);}

    .card{--surface:#fbfcfa;--text:#17201d;--muted:#68756e;--line:#e2e7e1;}
    .card-dark{--surface:#101718;--text:#f1f6f2;--muted:#94a19a;--line:#2a3632;}
    @media(prefers-color-scheme:dark){.card-auto{--surface:#101718;--text:#f1f6f2;--muted:#94a19a;--line:#2a3632;}}
    .surface{stroke:var(--line);stroke-width:1;}
    .brand{font-size:14px;font-weight:750;letter-spacing:.2px;}
    .brand-mark{fill:var(--accent);}
    .username{font-size:15px;font-weight:500;fill:var(--muted);}
    .cover-title{font-size:30px;font-weight:800;letter-spacing:-.7px;}
    .profile-score{font-size:38px;font-weight:800;text-anchor:end;letter-spacing:-1.5px;}
    .score-unit,.tagline,.footer{font-size:14px;fill:var(--muted);}
    .score-unit{text-anchor:end;}
    .project{font-size:14px;font-weight:600;}
    .muted{fill:var(--muted);font-weight:400;}
    .small-icon{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;}
  </style>
