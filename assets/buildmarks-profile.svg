<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="card card-auto" role="img" width="760" height="420" viewBox="0 0 760 420" aria-labelledby="title desc">
  <title id="title">Buildmarks project card for 0disoft</title>
  <desc id="desc">First Steps Coach. The first steps feel supported. The path is gathering a longer story. Buildmarks reviewed 30 repositories and found 30 project practices. The overall result is Gold I, 66 out of 100. Maintainability Platinum IV, 75 out of 100, Project Readiness Platinum V, 70 out of 100, Ease of Use Platinum II, 86 out of 100, Shipping Gold II, 53 out of 100, Consistency Gold IV, 27 out of 100, Project Care Gold I, 67 out of 100. Owner-supplied private repositories are included and cannot be checked independently on public GitHub. Buildmarks is not a developer ranking.</desc>
  <style>.card { --surface:#f4eedf;--text:#203044;--muted:#6b6260;--accent:#ac513d;--secondary:#dbc9a9;--track:#e0d7c6;--chip:#ebe1cf;--line:#d3c8b5; }
    .card-dark { --surface:#292b36;--text:#f4eedf;--muted:#c9beb6;--accent:#f1a58d;--secondary:#d8c6a4;--track:#4d454a;--chip:#3c3740;--line:#6e6064; }
    @media (prefers-color-scheme: dark) { .card-auto { --surface:#292b36;--text:#f4eedf;--muted:#c9beb6;--accent:#f1a58d;--secondary:#d8c6a4;--track:#4d454a;--chip:#3c3740;--line:#6e6064; } }
    text { font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:var(--text); }
    .surface { fill:var(--surface); }
    .brand { font-size:20px; font-weight:750; }
    .username { font-size:20px; font-weight:650; }
    .cover-title { font-size:30px; font-weight:800; letter-spacing:-.5px; }
    .tagline { font-size:13px; fill:var(--muted); }
    .profile-score { font-size:24px; font-weight:750; text-anchor:end; }
    .cover-serif { font-family:Georgia, "Times New Roman", serif; letter-spacing:-.5px; }
    .metric { font-size:15px; font-weight:600; }
    .value { font-size:15px; font-weight:700; text-anchor:end; font-variant-numeric:tabular-nums; }
    .missing { font-size:12px; font-weight:500; fill:var(--muted); }
    .missing-track { stroke:var(--line); stroke-width:2; stroke-dasharray:3 5; }
    .checked { font-size:12px; font-weight:600; fill:var(--muted); text-anchor:end; }
    .caption { font-size:12px; font-weight:600; fill:var(--muted); }
    .footer { font-size:12px; font-weight:500; fill:var(--muted); }
    .divider { stroke:var(--line); stroke-width:1; }
    .track { fill:var(--track); }
    .bar,.accent { fill:var(--accent); }
    .chip-bg { fill:var(--chip); }
    .chip { font-size:12px; font-weight:600; }

    .persona-emblem{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
    .emblem-halo{fill:var(--accent);fill-opacity:.07;stroke:none;}
    .emblem-paper{fill:var(--surface);}
    .emblem-fill{fill:var(--accent);}
    .emblem-cutout{fill:var(--surface);stroke:var(--surface);}
    .emblem-light{stroke:var(--surface);}
  </style>
