<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" class="card card-auto" data-layout="compact" role="img" width="420" height="304" viewBox="0 0 420 304" aria-labelledby="title desc">
  <title id="title">Buildmarks project card for 0disoft</title>
  <desc id="desc">First Steps Coach. The first steps feel supported. The path is gathering a longer story. Buildmarks reviewed 30 repositories and found 30 project practices. The overall result is Gold I, 66 out of 100. Maintainability Platinum V, 73 out of 100, Project Readiness Platinum V, 70 out of 100, Ease of Use Platinum II, 85 out of 100, Shipping Gold II, 55 out of 100, Consistency Gold IV, 27 out of 100, Project Care Gold I, 66 out of 100. Owner-supplied private repositories are included and cannot be checked independently on public GitHub. Buildmarks is not a developer ranking. Representative projects: 0disoft/buildmarks: Docs + examples; Release + manifest. 0disoft/mensor: Docs + examples</desc>
  <style>.card { --surface:#f4eedf;--text:#203044;--muted:#6b6260;--accent:#ac513d;--secondary:#dbc9a9;--track:#e0d7c6;--chip:#ebe1cf;--line:#d3c8b5; }
    .card-dark { --surface:#292b36;--text:#f4eedf;--muted:#c9beb6;--accent:#f1a58d;--secondary:#d8c6a4;--track:#4d454a;--chip:#3c3740;--line:#6e6064; }
    @media (prefers-color-scheme: dark) { .card-auto { --surface:#292b36;--text:#f4eedf;--muted:#c9beb6;--accent:#f1a58d;--secondary:#d8c6a4;--track:#4d454a;--chip:#3c3740;--line:#6e6064; } }
    text { font-family:ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:var(--text); }
    .surface { fill:var(--surface); }
    .brand { font-size:20px; font-weight:750; }
    .username { font-size:20px; font-weight:650; }
    .cover-title { font-size:30px; font-weight:800; letter-spacing:-.5px; }
