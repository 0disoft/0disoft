  <title id="title">Buildmarks project card for 0disoft</title>
  <desc id="desc">Buildmarks reviewed 30 repositories and found 30 project practices. The overall result is Gold I, 63 out of 100. Maintainability Platinum V, 74 out of 100, Project Readiness Gold I, 65 out of 100, Ease of Use Platinum IV, 76 out of 100, Shipping Gold III, 48 out of 100, Consistency Gold IV, 26 out of 100, Project Care Platinum V, 70 out of 100. Owner-supplied private repositories are included and cannot be checked independently on public GitHub. Buildmarks is not a developer ranking. Representative projects: 0disoft/genai-telemetry-redactor: Docs + examples; Release + manifest. 0disoft/velox: Docs + examples</desc>
  <style>.card { --surface:#f4eedf;--text:#203044;--muted:#6b6260;--accent:#ac513d;--secondary:#dbc9a9;--track:#e0d7c6;--chip:#ebe1cf;--line:#d3c8b5; }
